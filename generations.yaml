generations:
  - name: "Original Beetle (Type 1)"
    start_year: 1938
    end_year: 2003
    description: "The original Volkswagen Beetle, officially the Volkswagen Type 1, represents one of the most iconic automobile designs in history. Conceived in the 1930s as the 'people's car' (Volkswagen in German) under Ferdinand Porsche's direction, the Beetle featured a distinctive rounded silhouette, rear-mounted air-cooled flat-four engine, and simple, robust engineering focused on affordability and reliability. Production began in 1938 but was largely interrupted by World War II, with only 210 units produced during the war years. Series production commenced in December 1945 and continued remarkably with only evolutionary changes until 2003, when the last original Beetle rolled off the production line in Mexico on July 30, 2003. The rear-engine, rear-wheel-drive layout with torsion bar suspension proved surprisingly adaptable, with engine displacement gradually increasing from 1.1 to 1.6 liters and power rising from 25 to 50 horsepower over the decades. The basic shape remained instantly recognizable throughout production, though over 78,000 incremental updates occurred including larger windows (1965), revised front and rear styling, improved safety features, and enhanced comfort amenities. The interior maintained a spartan, functional approach with a simple flat dashboard, basic instrumentation, and minimal luxury features even in later models. Beyond its practical transportation role, the Beetle became a cultural phenomenon, symbolizing everything from post-war German industrial recovery to 1960s counterculture to Disney's 'Herbie' films. Over 21.5 million units were produced during its 65-year production run—the longest for any single generation of automobile—making it the most produced car of a single platform in history and the second-highest of all nameplates manufactured in the 20th century. This remarkable longevity established the Beetle as not merely a car but a cultural icon whose influence extended far beyond the automotive world. West German production ended July 1, 1974 at Wolfsburg (11,916,519 units), with final European sedan production January 19, 1978 at Emden. Production continued in Brazil until 1986 (resumed 1992-1996) and in Mexico until 2003."

  - name: "New Beetle (A4)"
    start_year: 1998
    end_year: 2005
    description: "The Volkswagen New Beetle represented a modern reinterpretation of the iconic original, introduced for the 1998 model year. Built on the Volkswagen Group A4 (PQ34) platform shared with the contemporary Golf Mk4, it featured front-engine, front-wheel-drive architecture rather than the rear-engine layout of its predecessor. Styling was deliberately retro-futuristic, maintaining the distinctive rounded silhouette, circular headlights, and separate fenders of the original Beetle but with modern proportions including a dramatically arched roofline, creating a cheerful, nostalgic appearance that capitalized on the strong emotional connection many consumers had with the original model. Engine options varied by market but included gasoline four-cylinders from 1.4 to 2.5-liters plus 1.9-liter TDI diesel options, with power outputs ranging from approximately 75 to 170 horsepower in the turbocharged 1.8T variants. Transmission choices included five and six-speed manuals, four and six-speed automatics, and later the 6-speed DSG dual-clutch. The interior featured a playful design with a dashboard-mounted flower vase, circular theme elements, and body-colored panels, though with significantly more comfort and features than the spartan original Beetle, including modern amenities such as air conditioning, power accessories, and premium audio options. A convertible variant was introduced for the 2003 model year to replace the Volkswagen Cabrio, further expanding the model's appeal. Special editions including the Turbo S, RSi (limited to 250 units with 3.2L VR6 engine and 4motion AWD), Color Concept, and various appearance packages helped maintain interest throughout the production run. The New Beetle achieved five-star Euro NCAP safety ratings and was named Motor Trend's 'Import Car of the Year' for 1999. It succeeded in its primary mission of creating a distinctive, emotionally appealing model that strengthened Volkswagen's brand image, particularly in the crucial North American market."

  - name: "New Beetle (A4 Facelift)"
    start_year: 2006
    end_year: 2011
    description: "The New Beetle received a significant mid-cycle facelift for the 2006 model year, introducing more angular bumpers and wheel wells along with revised exterior styling including sharper lines, updated VW emblems, and new wheel designs. The interior was also refreshed with revised materials and color options. Engine choices were updated, with the 2.5-liter five-cylinder becoming the base engine in North America, replacing the 2.0-liter four-cylinder. The 1.8T turbocharged engine continued as the performance option, while diesel enthusiasts could still choose the 1.9-liter TDI. Production continued at Volkswagen's Puebla, Mexico facility alongside the convertible variant. Special editions during this period included the Anniversary Edition (2008, celebrating 10 years of the New Beetle), the Blush convertible (2009, featuring unique white gold paint and burgundy leather), and the Final Edition (2010, marking the end of New Beetle production with unique Aquarius Blue paintwork). The Final Edition featured sports suspension, 'Final Edition' badging, and was available in both coupe and convertible body styles. Both models were powered by the 2.5-liter engine paired with automatic 'Tiptronic' transmission. The facelift successfully refreshed the model's appearance while maintaining its distinctive character, though sales continued to decline as consumer preferences shifted toward SUVs and crossovers. The New Beetle was succeeded for the 2012 model year by the Beetle (A5), which adopted a more masculine, sporty design."

  - name: "Beetle (A5)"
    start_year: 2012
    end_year: 2019
    description: "The final generation of the Volkswagen Beetle, dropping the 'New' prefix from its name, was built on the company's A5 (PQ35) platform shared with the Golf VI and Jetta Mk6. Introduced for the 2012 model year on April 18, 2011, simultaneously at Auto Shanghai and the New York International Auto Show, it featured a lower, wider stance and a flatter roofline than its predecessor, creating a more masculine, sporty appearance that moved away from the 'cute' aesthetic of the New Beetle toward a design more closely resembling the proportions of the original Type 1. Available in both hardtop coupe and convertible body styles (convertible introduced for 2013 model year), this generation aimed to broaden the Beetle's appeal beyond the predominantly female buyer base of the previous model. Engine options varied by market but typically included 1.2, 1.4, 1.8, and 2.0-liter turbocharged petrol units and 1.6 and 2.0-liter diesel options, with power outputs ranging from approximately 105 to 220 horsepower in the performance-oriented R-Line and GSR variants. North American models initially used a 2.5-liter five-cylinder engine, later replaced by a 1.8-liter turbo four-cylinder. Transmission choices included five and six-speed manuals, six-speed automatic, and six and seven-speed DSG dual-clutch automatics. The interior maintained distinctive Beetle elements including body-colored dashboard panels and circular themes but adopted a more conventional layout with higher quality materials and enhanced technology including a standard infotainment system, available navigation, and comprehensive connectivity options. Special editions were numerous throughout the production run, including the Black Turbo launch edition (limited to 600 units), Fender Edition (partnering with Fender Musical Instruments featuring a sunburst dashboard panel and premium audio system), GSR Limited Edition (yellow and black color scheme recalling the 1973 original GSR), Dune (raised suspension with rugged off-road styling), #PinkBeetle (pink accents and exclusive color), Coast/Coastline (surf-themed with wood dash accents), and Final Edition (2019, with Safari Uni Beige and Stonewashed Blue tribute colors). Despite these efforts to reinvigorate interest in the model, the Beetle faced declining sales as consumer preferences shifted increasingly toward SUVs and crossovers. Volkswagen announced the end of production on September 13, 2018, with the final third-generation Beetle (a denim blue coupe) finishing production on July 9, 2019, at the Puebla plant in Mexico. This final chapter of the Beetle story marked the end of one of the most recognizable automotive nameplates in history, with total A5 generation production reaching 552,804 units globally over its seven-year run."